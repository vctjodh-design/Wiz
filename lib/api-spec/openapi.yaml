          minimum: 1
        predictions:
          type: array
          items:
            $ref: "#/components/schemas/FootballModelPrediction"
      required: [fixtureId, predictions]
    FootballMatchModelPredictions:
      type: object
      properties:
        fixtureId:
          type: integer
          minimum: 1
        predictions:
          type: array
          items:
            $ref: "#/components/schemas/FootballModelPrediction"
