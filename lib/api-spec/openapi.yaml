        - home
        - away
        - expectedHomeGoals
        - expectedAwayGoals
        - outcomes
        - probabilities
        - topScorelines
        - playerContributions
        - method
        - limitations
    FootballFairAiSimulationContribution:
      type: object
      properties:
        playerKey:
          type: string
        teamName:
          type: string
        playerName:
          type: string
        simulatedGoals:
          type: integer
        simulatedAssists:
          type: integer
        contributionScore:
          type: number
      required:
        - playerKey
        - teamName
        - playerName
        - simulatedGoals
        - simulatedAssists
        - contributionScore
    FootballFairAiSimulationProbabilities:
      type: object
      properties:
        home:
          type: number
          minimum: 0
          maximum: 1
        draw:
          type: number
          minimum: 0
          maximum: 1
        away:
          type: number
          minimum: 0
          maximum: 1
      required: [home, draw, away]
    FootballModelResultProbabilities:
      type: object
      properties:
        home:
          type: number
          minimum: 0
          maximum: 1
        draw:
          type: number
          minimum: 0
          maximum: 1
        away:
          type: number
          minimum: 0
          maximum: 1
      required: [home, draw, away]
    FootballYesNoProbabilities:
      type: object
      properties:
        yes:
          type: number
          minimum: 0
          maximum: 1
        no:
          type: number
          minimum: 0
          maximum: 1
      required: [yes, no]
    FootballOverUnderProbabilities:
      type: object
      properties:
        over:
          type: number
          minimum: 0
          maximum: 1
        under:
          type: number
          minimum: 0
          maximum: 1
      required: [over, under]
    FootballCorrectScorePrediction:
      type: object
      properties:
