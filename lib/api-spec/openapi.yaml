openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: fixtures
    description: Football fixtures from KickoffScore
  - name: browser
    description: Remote Chromium browser sessions and controls
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /football/fixtures:
    get:
      operationId: getFootballFixtures
      tags: [fixtures]
      summary: Get football fixtures for a date
      description: Returns match details from KickoffScore for the selected calendar date
      parameters:
        - name: date
          in: query
          required: true
          description: Calendar date in YYYY-MM-DD format
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Fixtures for the selected date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtures"
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "502":
          description: KickoffScore could not be reached or its page could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/matches/{fixtureId}/details:
    get:
      operationId: getFootballMatchDetails
      tags: [fixtures]
      summary: Get match details, odds, standings, team form, and head-to-head
      description: Returns match details and related public data from KickoffScore
      parameters:
        - name: fixtureId
          in: path
          required: true
          description: KickoffScore fixture ID
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Match details and supporting data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballMatchDetails"
        "400":
          description: Invalid fixture ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "404":
          description: Match was not found on KickoffScore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "502":
          description: KickoffScore could not be reached or its data could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/matches/{fixtureId}/tmp:
    get:
      operationId: getFootballMatchTmp
      tags: [fixtures]
      summary: Get historical odds and standings context for match TMP
      description: Returns historical market expectations and latest available season tables for recent matches
      parameters:
        - name: fixtureId
          in: path
          required: true
          description: KickoffScore fixture ID
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: TMP supporting context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballMatchTmpContext"
        "400":
          description: Invalid fixture ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "404":
          description: Match was not found on KickoffScore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "502":
          description: KickoffScore could not be reached or its data could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /browser/sessions:
    post:
      operationId: createBrowserSession
      tags: [browser]
      summary: Start a browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrowserSessionInput"
      responses:
        "201":
          description: Browser session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "400":
          description: Invalid URL or request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "503":
          description: Browser capacity reached or Chromium unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
  /browser/sessions/{sessionId}:
    get:
      operationId: getBrowserSession
      tags: [browser]
      summary: Get current browser session state and screenshot
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Current browser state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "404":
          description: Session not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
    delete:
      operationId: closeBrowserSession
      tags: [browser]
      summary: Close a browser session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Browser session closed
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
  /browser/sessions/{sessionId}/navigate:
    post:
      operationId: navigateBrowser
      tags: [browser]
      summary: Navigate the active tab to a URL
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NavigateBrowserInput"
      responses:
        "200":
          description: Updated browser state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "400":
          description: Invalid or blocked URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
  /browser/sessions/{sessionId}/action:
    post:
      operationId: performBrowserAction
      tags: [browser]
      summary: Click, type, scroll, navigate history, or reload the active page
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserActionInput"
      responses:
        "200":
          description: Updated browser state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "400":
          description: Invalid browser action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
  /browser/sessions/{sessionId}/mouse:
    post:
      operationId: moveBrowserMouse
      tags: [browser]
      summary: Move the pointer within the active browser page
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MousePositionInput"
      responses:
        "200":
          description: Pointer moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MouseMoveResponse"
        "400":
          description: Invalid pointer position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
  /browser/sessions/{sessionId}/tabs:
    post:
      operationId: createBrowserTab
      tags: [browser]
      summary: Open a new browser tab
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrowserTabInput"
      responses:
        "201":
          description: Updated browser state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "400":
          description: Invalid or blocked URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "429":
          description: Tab limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
  /browser/sessions/{sessionId}/tabs/{tabId}/activate:
    post:
      operationId: activateBrowserTab
      tags: [browser]
      summary: Switch to a browser tab
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TabId"
      responses:
        "200":
          description: Updated browser state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "404":
          description: Session or tab not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
  /browser/sessions/{sessionId}/tabs/{tabId}:
    delete:
      operationId: closeBrowserTab
      tags: [browser]
      summary: Close a browser tab
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TabId"
      responses:
        "200":
          description: Updated browser state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "404":
          description: Session or tab not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    TabId:
      name: tabId
      in: path
      required: true
      schema:
        type: string
  schemas:
    FootballFixture:
      type: object
      properties:
        competition:
          type: string
        homeTeam:
          type: string
        awayTeam:
          type: string
        homeLogo:
          type: ["string", "null"]
          format: uri
        awayLogo:
          type: ["string", "null"]
          format: uri
        kickoff:
          type: string
          description: Kickoff time as shown by KickoffScore
        status:
          type: string
          description: Match status as shown by KickoffScore
        homeScore:
          type: ["integer", "null"]
        awayScore:
          type: ["integer", "null"]
        matchUrl:
          type: string
          format: uri
      required:
        - competition
        - homeTeam
        - awayTeam
        - homeLogo
        - awayLogo
        - kickoff
        - status
        - homeScore
        - awayScore
        - matchUrl
    FootballFixtures:
      type: object
      properties:
        date:
          type: string
          format: date
        sourceUrl:
          type: string
          format: uri
        fixtures:
          type: array
          items:
            $ref: "#/components/schemas/FootballFixture"
      required: [date, sourceUrl, fixtures]
    FootballMatchParticipant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        logo:
          type: ["string", "null"]
          format: uri
      required: [id, name, logo]
    FootballMatchTeam:
      allOf:
        - $ref: "#/components/schemas/FootballMatchParticipant"
        - type: object
          properties:
            score:
              type: ["integer", "null"]
            halfTimeScore:
              type: ["integer", "null"]
          required: [score, halfTimeScore]
    FootballMatchSummary:
      type: object
      properties:
        fixtureId:
          type: integer
        date:
          type: string
          format: date-time
        competition:
          type: string
        status:
          type: string
        venue:
          type: ["string", "null"]
        leagueId:
          type: ["integer", "null"]
        season:
          type: ["integer", "null"]
        home:
          $ref: "#/components/schemas/FootballMatchTeam"
        away:
          $ref: "#/components/schemas/FootballMatchTeam"
      required:
        - fixtureId
        - date
        - competition
        - status
        - venue
        - leagueId
        - season
        - home
        - away
    FootballRecentMatch:
      type: object
      properties:
        fixtureId:
          type: integer
        date:
          type: string
          format: date-time
        competition:
          type: string
        status:
          type: string
        leagueId:
          type: ["integer", "null"]
        season:
          type: ["integer", "null"]
        homeTeam:
          $ref: "#/components/schemas/FootballMatchParticipant"
        awayTeam:
          $ref: "#/components/schemas/FootballMatchParticipant"
        homeScore:
          type: ["integer", "null"]
        awayScore:
          type: ["integer", "null"]
      required:
        - fixtureId
        - date
        - competition
        - status
        - leagueId
        - season
        - homeTeam
        - awayTeam
        - homeScore
        - awayScore
    FootballStandingsRow:
      type: object
      properties:
        rank:
          type: integer
        teamId:
          type: integer
        teamName:
          type: string
        teamLogo:
          type: ["string", "null"]
          format: uri
        played:
          type: integer
        goalDifference:
          type: integer
        points:
          type: integer
        form:
          type: string
        homePlayed:
          type: integer
        homePoints:
          type: integer
        homeGoalDifference:
          type: integer
        awayPlayed:
          type: integer
        awayPoints:
          type: integer
        awayGoalDifference:
          type: integer
      required:
        - rank
        - teamId
        - teamName
        - teamLogo
        - played
        - goalDifference
        - points
        - form
        - homePlayed
        - homePoints
        - homeGoalDifference
        - awayPlayed
        - awayPoints
        - awayGoalDifference
    FootballOddsSelection:
      type: object
      properties:
        selection:
          type: string
        odd:
          type: number
        bookmaker:
          type: string
        bookmakerCount:
          type: integer
      required: [selection, odd, bookmaker, bookmakerCount]
    FootballOddsMarket:
      type: object
      properties:
        marketId:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [1x2, first-half, goals, handicap, other]
        selections:
          type: array
          items:
            $ref: "#/components/schemas/FootballOddsSelection"
      required: [marketId, name, category, selections]
    FootballHistoricalMarketSelection:
      type: object
      properties:
        selection:
          type: string
        probability:
          type: number
          minimum: 0
          maximum: 1
        bookmakerCount:
          type: integer
      required: [selection, probability, bookmakerCount]
    FootballHistoricalMarket:
      type: object
      properties:
        marketId:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [1x2, first-half, goals, handicap, other]
        selections:
          type: array
          items:
            $ref: "#/components/schemas/FootballHistoricalMarketSelection"
      required: [marketId, name, category, selections]
    FootballMatchOddsHistory:
      type: object
      properties:
        fixtureId:
          type: integer
        homeProbability:
          type: ["number", "null"]
          minimum: 0
          maximum: 1
        drawProbability:
          type: ["number", "null"]
          minimum: 0
          maximum: 1
        awayProbability:
          type: ["number", "null"]
          minimum: 0
          maximum: 1
        bookmakerCount:
          type: integer
        verifiedBookmakerCount:
          type: integer
        unverifiedBookmakerCount:
          type: integer
        marketCount:
          type: integer
        marketCategories:
          type: array
          items:
            type: string
            enum: [1x2, first-half, goals, handicap, other]
        markets:
          type: array
          items:
            $ref: "#/components/schemas/FootballHistoricalMarket"
        quoteSource:
          type: string
          enum: [verified, mixed, unverified, unavailable]
      required:
        - fixtureId
        - homeProbability
        - drawProbability
        - awayProbability
        - bookmakerCount
        - verifiedBookmakerCount
        - unverifiedBookmakerCount
        - marketCount
        - marketCategories
        - markets
        - quoteSource
    FootballSeasonStanding:
      type: object
      properties:
        leagueId:
          type: integer
        season:
          type: integer
        teamId:
          type: integer
        teamName:
          type: string
        rank:
          type: integer
        played:
          type: integer
        points:
          type: integer
        goalDifference:
          type: integer
      required:
        - leagueId
        - season
        - teamId
        - teamName
        - rank
        - played
        - points
        - goalDifference
    FootballMatchTmpIssue:
      type: object
      properties:
        section:
          type: string
          enum: [oddsHistory, standingsHistory]
        message:
          type: string
      required: [section, message]
    FootballMatchTmpContext:
      type: object
      properties:
        fixtureId:
          type: integer
        oddsHistory:
          type: array
          items:
            $ref: "#/components/schemas/FootballMatchOddsHistory"
        seasonStandings:
          type: array
          items:
            $ref: "#/components/schemas/FootballSeasonStanding"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/FootballMatchTmpIssue"
      required: [fixtureId, oddsHistory, seasonStandings, issues]
    FootballMatchDetailsIssue:
      type: object
      properties:
        section:
          type: string
          enum: [standings, odds, homeRecent, awayRecent, headToHead]
        message:
          type: string
      required: [section, message]
    FootballMatchDetails:
      type: object
      properties:
        sourceUrl:
          type: string
          format: uri
        match:
          $ref: "#/components/schemas/FootballMatchSummary"
        standings:
          type: array
          items:
            $ref: "#/components/schemas/FootballStandingsRow"
        oddsMarkets:
          type: array
          items:
            $ref: "#/components/schemas/FootballOddsMarket"
        homeRecent:
          type: array
          items:
            $ref: "#/components/schemas/FootballRecentMatch"
        awayRecent:
          type: array
          items:
            $ref: "#/components/schemas/FootballRecentMatch"
        headToHead:
          type: array
          items:
            $ref: "#/components/schemas/FootballRecentMatch"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/FootballMatchDetailsIssue"
      required:
        - sourceUrl
        - match
        - standings
        - oddsMarkets
        - homeRecent
        - awayRecent
        - headToHead
        - issues
    FootballFixtureError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BrowserError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    BrowserTab:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        title:
          type: string
        active:
          type: boolean
      required: [id, url, title, active]
    BrowserPageHeading:
      type: object
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 6
        text:
          type: string
      required: [level, text]
    BrowserPageLink:
      type: object
      properties:
        text:
          type: string
        href:
          type: string
      required: [text, href]
    BrowserPageContent:
      type: object
      properties:
        description:
          type: string
        text:
          type: string
        markdown:
          type: string
        headings:
          type: array
          items:
            $ref: "#/components/schemas/BrowserPageHeading"
        links:
          type: array
          items:
            $ref: "#/components/schemas/BrowserPageLink"
      required: [description, text, markdown, headings, links]
    BrowserState:
      type: object
      properties:
        sessionId:
          type: string
        activeTabId:
          type: string
        tabs:
          type: array
          items:
            $ref: "#/components/schemas/BrowserTab"
        screenshot:
          type: string
          description: Screenshot as a PNG data URL
        currentUrl:
          type: string
        title:
          type: string
        pageContent:
          $ref: "#/components/schemas/BrowserPageContent"
        viewportWidth:
          type: integer
        viewportHeight:
          type: integer
      required:
        - sessionId
        - activeTabId
        - tabs
        - screenshot
        - currentUrl
        - title
        - pageContent
        - viewportWidth
        - viewportHeight
    CreateBrowserSessionInput:
      type: object
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
        tabCount:
          type: integer
          minimum: 1
          maximum: 25
          description: Number of tabs to open with the starting URL
    NavigateBrowserInput:
      type: object
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
        syncTabs:
          type: boolean
          description: Navigate every open tab and open copies up to tabCount
        tabCount:
          type: integer
          minimum: 1
          maximum: 25
          description: Target number of tabs when syncTabs is enabled
      required: [url]
    CreateBrowserTabInput:
      type: object
      properties:
        url:
          type: string
          maxLength: 2048
      required: [url]
    BrowserActionInput:
      type: object
      properties:
        action:
          type: string
          enum: [click, type, key, scroll, back, forward, reload]
        x:
          type: number
          minimum: 0
        y:
          type: number
          minimum: 0
        text:
          type: string
          maxLength: 10000
        key:
          type: string
          maxLength: 50
        deltaY:
          type: number
          minimum: -5000
          maximum: 5000
        syncTabs:
          type: boolean
          description: Apply this browser action to every open tab
      required: [action]
    MousePositionInput:
      type: object
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1439
        y:
          type: number
          minimum: 0
          maximum: 899
        syncTabs:
          type: boolean
          description: Move the pointer in every open tab
      required: [x, y]
    MouseMoveResponse:
      type: object
      properties:
        moved:
          type: boolean
      required: [moved]

