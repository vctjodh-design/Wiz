        historyMatchCount:
          type: integer
          minimum: 0
        verifiedOddsHistoryCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
      required:
        - fixtureId
        - runId
        - modelType
        - result
        - bothTeamsToScore
        - overUnder25
        - overUnder35
        - correctScoreTop
        - historyMatchCount
        - verifiedOddsHistoryCount
        - createdAt
    FootballTesterMatchPredictions:
      type: object
      properties:
        fixtureId:
