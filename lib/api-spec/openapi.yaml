          format: date-time
        homeTeamName:
          type: string
        awayTeamName:
          type: string
        homeScore:
          type: ["integer", "null"]
        awayScore:
          type: ["integer", "null"]
      required: [fixtureId, date, homeTeamName, awayTeamName, homeScore, awayScore]
    FootballModelStandingInput:
