    FootballModelPredictionContextInput:
      type: object
      properties:
        matchDate:
          type: string
          format: date-time
        competition:
          type: string
        season:
          type: ["integer", "null"]
        homeTeamName:
          type: string
        awayTeamName:
          type: string
        leagueAverageGoals:
          type: ["number", "null"]
          minimum: 0
        homeRecent:
          type: array
          maxItems: 15
          items:
            $ref: "#/components/schemas/FootballModelFormMatchInput"
        awayRecent:
          type: array
          maxItems: 15
          items:
            $ref: "#/components/schemas/FootballModelFormMatchInput"
        homeLastFive:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/FootballModelFormMatchInput"
        awayLastFive:
