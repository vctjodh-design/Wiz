openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: fixtures
    description: Football fixtures from KickoffScore
  - name: processing
    description: Bulk processing and locally stored match records
  - name: browser
    description: Remote Chromium browser sessions and controls
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /football/fixtures:
    get:
      operationId: getFootballFixtures
      tags: [fixtures]
      summary: Get football fixtures for a date
      description: Returns match details from KickoffScore for the selected calendar date
      parameters:
        - name: date
          in: query
          required: true
          description: Calendar date in YYYY-MM-DD format
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Fixtures for the selected date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtures"
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "429":
          description: KickoffScore is temporarily rate limiting requests
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before trying again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "502":
          description: KickoffScore could not be reached or its page could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/processings:
    get:
      operationId: getFootballProcessingForDate
      tags: [processing]
      summary: Get the latest processing job for a match date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Latest saved processing job for the date, if one exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballProcessingJobLookup"
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
    post:
      operationId: startFootballBulkProcessing
      tags: [processing]
      summary: Start processing completed matches for a date
      description: Starts an asynchronous import of completed KickoffScore matches and their analysis data into the local SQLite archive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FootballBulkProcessingInput"
      responses:
        "202":
          description: Processing job started or an active job for the date was returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballProcessingJob"
        "400":
          description: Invalid date or date is not in the past
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "429":
          description: KickoffScore is temporarily rate limiting requests
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before trying again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "502":
          description: KickoffScore fixtures could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/processings/{jobId}:
    get:
      operationId: getFootballProcessingJob
      tags: [processing]
      summary: Get bulk processing progress
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Processing job progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballProcessingJob"
        "404":
          description: Processing job was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/tester-processings:
    get:
      operationId: getFootballTesterProcessingForDate
      tags: [processing]
      summary: Get the latest pre-match tester job for a match date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Latest tester job for the date, if one exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballProcessingJobLookup"
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
    post:
      operationId: startFootballTesterProcessing
      tags: [processing]
      summary: Build pre-match tester records for a date
      description: Collects match context and historical features without storing the target match score or outcome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FootballBulkProcessingInput"
      responses:
        "202":
          description: Tester job started or the active tester job for the date was returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballProcessingJob"
        "400":
          description: Invalid date or date is not in the past
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "409":
          description: Another match-processing job is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "429":
          description: KickoffScore is temporarily rate limiting requests
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before trying again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "502":
          description: KickoffScore fixtures could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/model-training:
    get:
      operationId: getFootballModelTrainingDashboard
      tags: [model-training]
      summary: Get the archived match dataset summary and recent training runs
      responses:
        "200":
          description: Dataset coverage and recent model training runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballModelTrainingDashboard"
  /football/fair-ai/data:
    get:
      operationId: getFootballFairAiData
      tags: [fair-ai]
      summary: Get normalized KickoffScore data coverage for the FAIR AI build
      responses:
        "200":
          description: Source-backed entity counts, import progress, and data limitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFairAiDataSummary"
  /football/fair-ai/teams:
    get:
      operationId: getFootballFairAiTeams
      tags: [fair-ai]
      summary: Search teams with imported match records for an archive simulation
      parameters:
        - in: query
          name: search
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Teams with their recent observed match baselines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFairAiTeamsResponse"
  /football/fair-ai/simulate:
    post:
      operationId: runFootballFairAiSimulation
      tags: [fair-ai]
      summary: Run an archive-based Monte Carlo scoreline preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FootballFairAiSimulationInput"
      responses:
        "200":
          description: Monte Carlo outcome distribution and historical input summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFairAiSimulation"
        "404":
          description: One or both teams have no imported match records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/fair-ai/data/ingest:
    post:
      operationId: startFootballFairAiDataIngestion
      tags: [fair-ai]
      summary: Start or resume normalized data ingestion from the match archive
      responses:
        "202":
          description: Ingestion is running or resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFairAiDataSummary"
  /football/model-training/runs:
    post:
      operationId: startFootballModelTraining
      tags: [model-training]
      summary: Train a football outcome model from archived matches
      description: Starts chronological holdout training using only information available before each archived match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FootballModelTrainingInput"
      responses:
        "202":
          description: Training run queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballModelTrainingRun"
        "400":
          description: Invalid training configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "409":
          description: Another model is currently training
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "422":
          description: The archive does not contain enough eligible matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/model-training/runs/{runId}:
    get:
      operationId: getFootballModelTrainingRun
      tags: [model-training]
      summary: Get a model training run and its evaluation
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Training run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballModelTrainingRun"
        "404":
          description: Training run was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/processed-matches:
    get:
      operationId: getFootballProcessedMatches
      tags: [processing]
      summary: List saved match records
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Saved matches and pagination metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballProcessedMatches"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
    delete:
      operationId: deleteAllFootballProcessedMatches
      tags: [processing]
      summary: Delete all archived match records
      description: Deletes every saved match record but retains processing job history; refuses while a job is running
      responses:
        "200":
          description: Number of match records deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteFootballProcessedMatchesResponse"
        "409":
          description: A processing job is still running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/processed-matches/{fixtureId}:
    get:
      operationId: getFootballProcessedMatch
      tags: [processing]
      summary: Get the saved summary for one match
      parameters:
        - name: fixtureId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Small saved match metadata response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballProcessedMatchSummary"
        "400":
          description: Invalid match ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "404":
          description: Saved match was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/processed-match-payload:
    get:
      operationId: getFootballProcessedMatchPayload
      tags: [processing]
      summary: Get one stored analysis payload for a match
      parameters:
        - name: fixtureId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: section
          in: query
          required: true
          schema:
            type: string
            enum: [details, lastFive, tmp]
      responses:
        "200":
          description: Requested payload section; responses are gzip-compressed when supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballProcessedMatchPayload"
        "400":
          description: Invalid match ID or section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "404":
          description: Saved match was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/tester-matches:
    get:
      operationId: getFootballTesterMatches
      tags: [processing]
      summary: List saved pre-match tester records
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: search
          in: query
          required: false
          description: Search saved tester matches by team, competition, or fixture ID
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Pre-match records and pagination metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballTesterMatches"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
    delete:
      operationId: deleteAllFootballTesterMatches
      tags: [processing]
      summary: Delete all pre-match tester records
      description: Deletes tester records but retains processing job history; refuses while a tester job is running
      responses:
        "200":
          description: Number of tester records deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteFootballTesterMatchesResponse"
        "409":
          description: A tester processing job is still running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/tester-matches/{fixtureId}:
    get:
      operationId: getFootballTesterMatch
      tags: [processing]
      summary: Get one pre-match tester summary without target outcome fields
      parameters:
        - name: fixtureId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Pre-match tester summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballTesterMatchSummary"
        "400":
          description: Invalid match ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "404":
          description: Tester record was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/matches/{fixtureId}/model-predictions:
    get:
      operationId: getFootballMatchModelPredictions
      tags: [model-training]
      summary: Get saved model predictions for a match fixture
      parameters:
        - name: fixtureId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Saved predictions from the available trained models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballMatchModelPredictions"
        "400":
          description: Invalid match ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
    post:
      operationId: predictFootballMatch
      tags: [model-training]
      summary: Generate model predictions from the match graph's loaded context
      description: Uses earlier results and the fixture's supplied pre-match form, standings, league average, and TMP odds context.
      parameters:
        - name: fixtureId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FootballModelPredictionContextInput"
      responses:
        "200":
          description: Predictions from every available trained architecture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballMatchModelPredictions"
        "400":
          description: Invalid match ID or prediction context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "422":
          description: No compatible trained model is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/tester-matches/{fixtureId}/model-predictions:
    get:
      operationId: getFootballTesterMatchModelPredictions
      tags: [model-training]
      summary: Get saved model predictions for a tester fixture
      parameters:
        - name: fixtureId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Saved predictions from the available trained models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballTesterMatchPredictions"
        "400":
          description: Invalid match ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
    post:
      operationId: predictFootballTesterMatch
      tags: [model-training]
      summary: Predict all markets using the newest trained model of each architecture
      description: Uses the saved pre-match tester fixture and only earlier archived match history; predictions are persisted for graph views.
      parameters:
        - name: fixtureId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Predictions from every available trained architecture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballTesterMatchPredictions"
        "400":
          description: Invalid match ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "404":
          description: Tester fixture was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "422":
          description: No prediction-ready model is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/tester-match-payload:
    get:
      operationId: getFootballTesterMatchPayload
      tags: [processing]
      summary: Get one stored pre-match tester payload section
      parameters:
        - name: fixtureId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: section
          in: query
          required: true
          schema:
            type: string
            enum: [details, lastFive, tmp]
      responses:
        "200":
          description: Pre-match payload section; responses are gzip-compressed when supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballTesterMatchPayload"
        "400":
          description: Invalid match ID or section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "404":
          description: Tester record was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/matches/{fixtureId}/details:
    get:
      operationId: getFootballMatchDetails
      tags: [fixtures]
      summary: Get match details, odds, standings, team form, and head-to-head
      description: Returns match details and related public data from KickoffScore
      parameters:
        - name: fixtureId
          in: path
          required: true
          description: KickoffScore fixture ID
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Match details and supporting data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballMatchDetails"
        "400":
          description: Invalid fixture ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "404":
          description: Match was not found on KickoffScore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "429":
          description: KickoffScore is temporarily rate limiting requests
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before trying again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "502":
          description: KickoffScore could not be reached or its data could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/matches/{fixtureId}/tmp:
    get:
      operationId: getFootballMatchTmp
      tags: [fixtures]
      summary: Get historical odds and standings context for match TMP
      description: Returns historical market expectations and latest available season tables for recent matches
      parameters:
        - name: fixtureId
          in: path
          required: true
          description: KickoffScore fixture ID
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: TMP supporting context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballMatchTmpContext"
        "400":
          description: Invalid fixture ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "404":
          description: Match was not found on KickoffScore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "429":
          description: KickoffScore is temporarily rate limiting requests
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before trying again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "502":
          description: KickoffScore could not be reached or its data could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /football/matches/{fixtureId}/last-five:
    get:
      operationId: getFootballMatchLastFive
      tags: [fixtures]
      summary: Get detailed data for each team's last five matches
      description: Returns match events, lineups, player statistics, match statistics, prematch context, and all supplied odds markets for each recent result
      parameters:
        - name: fixtureId
          in: path
          required: true
          description: KickoffScore fixture ID
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Recent match data for both teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballMatchLastFive"
        "400":
          description: Invalid fixture ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "404":
          description: Match was not found on KickoffScore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "429":
          description: KickoffScore is temporarily rate limiting requests
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before trying again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
        "502":
          description: KickoffScore could not be reached or its data could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootballFixtureError"
  /browser/sessions:
    post:
      operationId: createBrowserSession
      tags: [browser]
      summary: Start a browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrowserSessionInput"
      responses:
        "201":
          description: Browser session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "400":
          description: Invalid URL or request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "503":
          description: Browser capacity reached or Chromium unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
  /browser/sessions/{sessionId}:
    get:
      operationId: getBrowserSession
      tags: [browser]
      summary: Get current browser session state and screenshot
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Current browser state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "404":
          description: Session not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
    delete:
      operationId: closeBrowserSession
      tags: [browser]
      summary: Close a browser session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Browser session closed
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
  /browser/sessions/{sessionId}/navigate:
    post:
      operationId: navigateBrowser
      tags: [browser]
      summary: Navigate the active tab to a URL
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NavigateBrowserInput"
      responses:
        "200":
          description: Updated browser state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "400":
          description: Invalid or blocked URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
  /browser/sessions/{sessionId}/action:
    post:
      operationId: performBrowserAction
      tags: [browser]
      summary: Click, type, scroll, navigate history, or reload the active page
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserActionInput"
      responses:
        "200":
          description: Updated browser state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "400":
          description: Invalid browser action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
  /browser/sessions/{sessionId}/mouse:
    post:
      operationId: moveBrowserMouse
      tags: [browser]
      summary: Move the pointer within the active browser page
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MousePositionInput"
      responses:
        "200":
          description: Pointer moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MouseMoveResponse"
        "400":
          description: Invalid pointer position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
  /browser/sessions/{sessionId}/tabs:
    post:
      operationId: createBrowserTab
      tags: [browser]
      summary: Open a new browser tab
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrowserTabInput"
      responses:
        "201":
          description: Updated browser state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "400":
          description: Invalid or blocked URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
        "429":
          description: Tab limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
  /browser/sessions/{sessionId}/tabs/{tabId}/activate:
    post:
      operationId: activateBrowserTab
      tags: [browser]
      summary: Switch to a browser tab
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TabId"
      responses:
        "200":
          description: Updated browser state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "404":
          description: Session or tab not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
  /browser/sessions/{sessionId}/tabs/{tabId}:
    delete:
      operationId: closeBrowserTab
      tags: [browser]
      summary: Close a browser tab
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TabId"
      responses:
        "200":
          description: Updated browser state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "404":
          description: Session or tab not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserError"
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    TabId:
      name: tabId
      in: path
      required: true
      schema:
        type: string
  schemas:
    FootballFixture:
      type: object
      properties:
        competition:
          type: string
        homeTeam:
          type: string
        awayTeam:
          type: string
        homeLogo:
          type: ["string", "null"]
          format: uri
        awayLogo:
          type: ["string", "null"]
          format: uri
        kickoff:
          type: string
          description: Kickoff time as shown by KickoffScore
        status:
          type: string
          description: Match status as shown by KickoffScore
        homeScore:
          type: ["integer", "null"]
        awayScore:
          type: ["integer", "null"]
        matchUrl:
          type: string
          format: uri
      required:
        - competition
        - homeTeam
        - awayTeam
        - homeLogo
        - awayLogo
        - kickoff
        - status
        - homeScore
        - awayScore
        - matchUrl
    FootballFixtures:
      type: object
      properties:
        date:
          type: string
          format: date
        sourceUrl:
          type: string
          format: uri
        fixtures:
          type: array
          items:
            $ref: "#/components/schemas/FootballFixture"
      required: [date, sourceUrl, fixtures]
    FootballBulkProcessingInput:
      type: object
      properties:
        date:
          type: string
          format: date
      required: [date]
    FootballProcessingJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        status:
          type: string
          enum: [queued, running, completed, partial, failed]
        totalFixtures:
          type: integer
        processedFixtures:
          type: integer
        savedFixtures:
          type: integer
        skippedFixtures:
          type: integer
        failedFixtures:
          type: integer
        error:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - date
        - status
        - totalFixtures
        - processedFixtures
        - savedFixtures
        - skippedFixtures
        - failedFixtures
        - error
        - createdAt
        - updatedAt
    FootballProcessingJobLookup:
      type: object
      properties:
        job:
          oneOf:
            - $ref: "#/components/schemas/FootballProcessingJob"
            - type: "null"
      required: [job]
    FootballModelType:
      type: string
      enum: [lstm, gru, transformer, gnn, dynamic-graph, catboost, xgboost]
    FootballModelTrainingInput:
      type: object
      properties:
        modelType:
          $ref: "#/components/schemas/FootballModelType"
        epochs:
          type: integer
          minimum: 5
          maximum: 100
          default: 24
        sequenceLength:
          type: integer
          minimum: 3
          maximum: 15
          default: 10
        hiddenUnits:
          type: integer
          minimum: 4
          maximum: 64
          default: 16
      required: [modelType]
    FootballModelTrainingStatus:
      type: string
      enum: [queued, training, completed, failed]
    FootballModelTrainingRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        modelType:
          $ref: "#/components/schemas/FootballModelType"
        status:
          $ref: "#/components/schemas/FootballModelTrainingStatus"
        epochs:
          type: integer
        completedEpochs:
          type: integer
        sequenceLength:
          type: integer
        hiddenUnits:
          type: integer
        sampleCount:
          type: integer
        trainingSampleCount:
          type: integer
        validationSampleCount:
          type: integer
        verifiedOddsFixtureCount:
          type: integer
        accuracy:
          type: ["number", "null"]
        baselineAccuracy:
          type: ["number", "null"]
        logLoss:
          type: ["number", "null"]
        brierScore:
          type: ["number", "null"]
        confusionMatrix:
          type: array
          items:
            type: array
            items:
              type: integer
        trainingLoss:
          type: array
          items:
            type: number
        validationLoss:
          type: array
          items:
            type: number
        hasSavedWeights:
          type: boolean
        hasPredictionArtifact:
          type: boolean
        error:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - modelType
        - status
        - epochs
        - completedEpochs
        - sequenceLength
        - hiddenUnits
        - sampleCount
        - trainingSampleCount
        - validationSampleCount
        - verifiedOddsFixtureCount
        - accuracy
        - baselineAccuracy
        - logLoss
        - brierScore
        - confusionMatrix
        - trainingLoss
        - validationLoss
        - hasSavedWeights
        - hasPredictionArtifact
        - error
        - createdAt
        - updatedAt
    FootballModelTrainingOutcomeCounts:
      type: object
      properties:
        home:
          type: integer
        draw:
          type: integer
        away:
          type: integer
      required: [home, draw, away]
    FootballModelTrainingDashboard:
      type: object
      properties:
        matchCount:
          type: integer
        teamCount:
          type: integer
        firstMatchDate:
          type: ["string", "null"]
          format: date
        lastMatchDate:
          type: ["string", "null"]
          format: date
        outcomeCounts:
          $ref: "#/components/schemas/FootballModelTrainingOutcomeCounts"
        verifiedOddsFixtureCount:
          type: integer
        runs:
          type: array
          items:
            $ref: "#/components/schemas/FootballModelTrainingRun"
      required:
        - matchCount
        - teamCount
        - firstMatchDate
        - lastMatchDate
        - outcomeCounts
        - verifiedOddsFixtureCount
        - runs
    FootballFairAiDataSummary:
      type: object
      properties:
        status:
          type: string
          enum: [idle, running, completed, failed]
        sourceFixtureCount:
          type: integer
        processedSourceFixtureCount:
          type: integer
        skippedSourceFixtureCount:
          type: integer
        remainingSourceFixtureCount:
          type: integer
        teamCount:
          type: integer
        matchCount:
          type: integer
        playerCount:
          type: integer
        coachCount:
          type: integer
        playerMatchCount:
          type: integer
        tacticalProfileCount:
          type: integer
        standingSnapshotCount:
          type: integer
        eventCount:
          type: integer
        playerWithStableIdCount:
          type: integer
        playerWithRatingCount:
          type: integer
        coachWithStableIdCount:
          type: integer
        teamWithFormationCount:
          type: integer
        lastImportedAt:
          type: ["string", "null"]
          format: date-time
        lastError:
          type: ["string", "null"]
        trackingCoordinateRecords:
          type: integer
          description: Number of tracked spatial records imported from this source. Aggregate KickoffScore records do not provide tracking coordinates.
      required:
        - status
        - sourceFixtureCount
        - processedSourceFixtureCount
        - skippedSourceFixtureCount
        - remainingSourceFixtureCount
        - teamCount
        - matchCount
        - playerCount
        - coachCount
        - playerMatchCount
        - tacticalProfileCount
        - standingSnapshotCount
        - eventCount
        - playerWithStableIdCount
        - playerWithRatingCount
        - coachWithStableIdCount
        - teamWithFormationCount
        - lastImportedAt
        - lastError
        - trackingCoordinateRecords
    FootballFairAiTeam:
      type: object
      properties:
        teamKey:
          type: string
        name:
          type: string
        matchCount:
          type: integer
        recentMatchCount:
          type: integer
        avgGoalsFor:
          type: number
        avgGoalsAgainst:
          type: number
        avgPlayerRating:
          type: ["number", "null"]
        formation:
          type: ["string", "null"]
        teamStats:
          $ref: "#/components/schemas/FootballFairAiTeamStats"
        players:
