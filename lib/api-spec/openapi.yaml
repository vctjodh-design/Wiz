        fixtureId:
          type: integer
        section:
          type: string
          enum: [details, lastFive, tmp]
        payload:
          type: object
          additionalProperties: true
      required: [fixtureId, section, payload]
    FootballProcessedMatchSummary:
      type: object
      properties:
