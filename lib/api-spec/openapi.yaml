          type: integer
          minimum: 1
        played:
          type: integer
          minimum: 0
        points:
          type: integer
          minimum: 0
        goalDifference:
          type: integer
      required: [rank, played, points, goalDifference]
    FootballModelOddsInput:
      type: object
      properties:
        fixtureId:
          type: integer
          minimum: 1
        homeProbability:
          type: ["number", "null"]
          minimum: 0
          maximum: 1
        drawProbability:
          type: ["number", "null"]
          minimum: 0
          maximum: 1
        awayProbability:
          type: ["number", "null"]
          minimum: 0
          maximum: 1
        verifiedBookmakerCount:
          type: integer
          minimum: 0
        quoteSource:
          type: string
