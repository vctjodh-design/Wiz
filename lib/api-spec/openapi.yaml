            $ref: "#/components/schemas/FootballFairAiSimulationPlayer"
      required:
        - teamKey
        - name
        - matchCount
        - recentMatchCount
        - avgGoalsFor
        - avgGoalsAgainst
        - avgPlayerRating
        - formation
    FootballFairAiTeamStats:
      type: object
      properties:
        expectedGoalsFor:
          type: ["number", "null"]
        expectedGoalsAgainst:
          type: ["number", "null"]
        possessionPct:
          type: ["number", "null"]
        shotsPerMatch:
          type: ["number", "null"]
        shotsOnTargetPerMatch:
          type: ["number", "null"]
        shotsInsideBoxPerMatch:
          type: ["number", "null"]
        boxTouchesPerMatch:
          type: ["number", "null"]
        bigChancesPerMatch:
          type: ["number", "null"]
        passCompletionPct:
          type: ["number", "null"]
        longBallCompletionPct:
          type: ["number", "null"]
        finalThirdPassCompletionPct:
          type: ["number", "null"]
        duelWinPct:
          type: ["number", "null"]
        defensiveActionsPerMatch:
          type: ["number", "null"]
        recoveriesPerMatch:
          type: ["number", "null"]
        redCardsPerMatch:
          type: ["number", "null"]
        yellowCardsPerMatch:
          type: ["number", "null"]
        leagueRank:
          type: ["integer", "null"]
        leaguePoints:
          type: ["integer", "null"]
        goalDifference:
          type: ["integer", "null"]
        coachMatches:
          type: integer
        coachWinPct:
          type: ["number", "null"]
        daysSinceLastMatch:
          type: ["number", "null"]
        matchStatSampleCount:
          type: integer
        coachName:
          type: ["string", "null"]
      required:
        - expectedGoalsFor
        - expectedGoalsAgainst
        - possessionPct
        - shotsPerMatch
        - shotsOnTargetPerMatch
        - shotsInsideBoxPerMatch
        - boxTouchesPerMatch
        - bigChancesPerMatch
        - passCompletionPct
        - longBallCompletionPct
        - finalThirdPassCompletionPct
        - duelWinPct
        - defensiveActionsPerMatch
        - recoveriesPerMatch
        - redCardsPerMatch
        - yellowCardsPerMatch
        - leagueRank
        - leaguePoints
        - goalDifference
        - coachMatches
        - coachWinPct
        - daysSinceLastMatch
        - matchStatSampleCount
        - coachName
    FootballFairAiSimulationPlayer:
      type: object
      properties:
        playerKey:
          type: string
        name:
          type: string
        position:
          type: ["string", "null"]
        starter:
          type: boolean
        appearances:
          type: integer
        averageRating:
          type: ["number", "null"]
        minutesPerMatch:
          type: number
        passCompletionPct:
          type: ["number", "null"]
        keyPassesPer90:
          type: number
        shotsPer90:
          type: number
        expectedGoalsPer90:
          type: number
        goalsPer90:
          type: number
        assistsPer90:
          type: number
        duelsWonPct:
          type: ["number", "null"]
        tacklesPer90:
          type: number
        interceptionsPer90:
          type: number
        savesPer90:
          type: number
      required:
        - playerKey
        - name
        - position
        - starter
        - appearances
        - averageRating
        - minutesPerMatch
        - passCompletionPct
        - keyPassesPer90
        - shotsPer90
        - expectedGoalsPer90
        - goalsPer90
        - assistsPer90
        - duelsWonPct
        - tacklesPer90
        - interceptionsPer90
        - savesPer90
    FootballFairAiTeamsResponse:
      type: object
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/FootballFairAiTeam"
      required: [teams]
    FootballFairAiSimulationInput:
      type: object
      properties:
        homeTeamKey:
          type: string
          minLength: 1
        awayTeamKey:
          type: string
          minLength: 1
        iterations:
          type: integer
          minimum: 1000
          maximum: 50000
          default: 10000
      required: [homeTeamKey, awayTeamKey]
    FootballFairAiSimulationOutcome:
      type: object
      properties:
        home:
          type: integer
        draw:
          type: integer
        away:
          type: integer
      required: [home, draw, away]
    FootballFairAiSimulationScoreline:
      type: object
      properties:
        homeGoals:
          type: integer
        awayGoals:
          type: integer
        count:
          type: integer
        probability:
          type: number
      required: [homeGoals, awayGoals, count, probability]
    FootballFairAiSimulation:
      type: object
      properties:
        iterations:
          type: integer
        home:
          $ref: "#/components/schemas/FootballFairAiTeam"
        away:
          $ref: "#/components/schemas/FootballFairAiTeam"
        expectedHomeGoals:
          type: number
        expectedAwayGoals:
          type: number
        outcomes:
          $ref: "#/components/schemas/FootballFairAiSimulationOutcome"
        probabilities:
          $ref: "#/components/schemas/FootballFairAiSimulationProbabilities"
        topScorelines:
          type: array
          items:
